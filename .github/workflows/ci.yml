name: CI/CD Pipeline with Security Scanning

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build Application
        run: go build -o myapp

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      # Gosec Security Scanner
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -fmt=html -out=gosec-report.html ./...
        continue-on-error: true

      - name: Upload Gosec Report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.html
          if-no-files-found: ignore

      # Go Vulnerability Scanner
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "GOPATH: $(go env GOPATH)"
          echo "PATH: $PATH"

      - name: Run govulncheck
        run: |
          $(go env GOPATH)/bin/govulncheck -show=traces ./... > govulncheck-report.txt || echo "Vulnerabilities found or scan failed"
        continue-on-error: true

      - name: Upload govulncheck Report
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck-report.txt
          if-no-files-found: ignore

      # Альтернатива Snyk для Go проектов
      - name: Run OWASP Dependency Check (альтернатива Snyk)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'go-project'
          path: '.'
          format: 'HTML'
          args: >
            --scan . 
            --enableRetired
        continue-on-error: true

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: dependency-check-report.html
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...
        continue-on-error: false

  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [test, build, security-scanning, lint]
    if: always()
    steps:
      - name: Check Pipeline Status
        run: |
          echo "✅ All CI/CD checks completed"
          echo "Test job: ${{ needs.test.result }}"
          echo "Build job: ${{ needs.build.result }}"
          echo "Security Scanning job: ${{ needs.security-scanning.result }}"
          echo "Lint job: ${{ needs.lint.result }}"